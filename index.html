<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Menú - Gracia Sublime</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
  <img src="imagenes/logo.jpeg" alt="Logo Gracia Sublime">
  <h1>Café Concert - Pedido de comida</h1>
</header>

<div class="contenedor">
  <div class="cliente-info">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" placeholder="Tu nombre" required>

    <label for="mesa">Mesa:</label>
    <select id="mesa" required>
      <option value="" disabled selected>Seleccioná tu mesa</option>
      <option value="1">Mesa 1</option>
      <option value="2">Mesa 2</option>
      <option value="3">Mesa 3</option>
      <option value="4">Mesa 4</option>
      <option value="5">Mesa 5</option>
      <option value="Entrada de la cocina">No tengo, recibo mi pedido en la entrada de la cocina</option>
    </select>
  </div>

  <h2>Comidas</h2>
  <div class="menu-grid">
    <div class="card">
      <img src="imagenes/pizza.jpeg"alt="Muzza">
      <div class="card-body">
        <h3>Muzza</h3>
        <p>$5.500</p>
        <div class="cantidad-control" data-precio="5500" data-nombre="Muzza">
          <button class="menos">-</button>
          <span class="cantidad">0</span>
          <button class="mas">+</button>
        </div>
      </div>
    </div>

    <div class="card">
      <img src="imagenes/papas.png" alt="Papas fritas">
      <div class="card-body">
        <h3>Papas fritas</h3>
        <p>$6.200</p>
        <div class="cantidad-control" data-precio="6200" data-nombre="Papas fritas">
          <button class="menos">-</button>
          <span class="cantidad">0</span>
          <button class="mas">+</button>
        </div>
      </div>
    </div>
  </div>

  <h2>Bebidas</h2>
  <div class="menu-grid">
    <div class="card">
      <img src="imagenes/bebidas.png" alt="Gaseosa 3L">
      <div class="card-body">
        <h3>Gaseosa</h3>
        <p>$2.500</p>
        <div class="sabor-selector">
          <label>Sabor:</label>
          <select class="sabor-select">
            <option value="Cola">Cola</option>
            <option value="Manzana">Manzana</option>
            <option value="Naranja">Naranja</option>
            <option value="Pomelo">Pomelo</option>
          </select>
        </div>
        <div class="cantidad-control" data-precio="2500" data-nombre="Gaseosa 3L">
          <button class="menos">-</button>
          <span class="cantidad">0</span>
          <button class="mas">+</button>
        </div>
      </div>
    </div>
  </div>

  <h2>Promos</h2>
  <div class="menu-grid">
    <div class="card">
      <img src="imagenes/promo1.jpg" alt="Promo Porción de pizza + Vaso de gaseosa">
      <div class="card-body">
        <h3>Promo: Porción de pizza + Vaso de gaseosa</h3>
        <p>$1.500</p>
        <div class="sabor-selector">
          <label>Sabor Gaseosa:</label>
          <select class="sabor-select">
            <option value="Cola">Cola</option>
            <option value="Manzana">Manzana</option>
            <option value="Naranja">Naranja</option>
            <option value="Pomelo">Pomelo</option>
          </select>
        </div>
        <div class="cantidad-control" data-precio="1500" data-nombre="Promo Pizza + Gaseosa">
          <button class="menos">-</button>
          <span class="cantidad">0</span>
          <button class="mas">+</button>
        </div>
      </div>
    </div>
    <div class="card">
      <img src="imagenes/promo2.jpg" alt="Promo Papas + Vaso de gaseosa">
      <div class="card-body">
        <h3>Promo: Papas + Vaso de gaseosa</h3>
        <p>$2.000</p>
        <div class="sabor-selector">
          <label>Sabor Gaseosa:</label>
          <select class="sabor-select">
            <option value="Cola">Cola</option>
            <option value="Manzana">Manzana</option>
            <option value="Naranja">Naranja</option>
            <option value="Pomelo">Pomelo</option>
          </select>
        </div>
        <div class="cantidad-control" data-precio="2000" data-nombre="Promo Papas + Gaseosa">
          <button class="menos">-</button>
          <span class="cantidad">0</span>
          <button class="mas">+</button>
        </div>
      </div>
    </div>
  </div>

  <div id="total-container">Total: $0</div>

  <div class="pago-container">
    <label for="metodo-pago">Método de pago:</label>
    <select id="metodo-pago">
      <option value="">Seleccionar</option>
      <option value="Efectivo">Efectivo</option>
      <option value="MercadoPago">MercadoPago</option>
    </select>
    <div id="alias" style="display:none;">Alias: cofee.concert</div>
  </div>

  <button class="enviar">Enviar pedido por WhatsApp</button>
</div>

<script src="script.js"></script>
</body>
</html>
